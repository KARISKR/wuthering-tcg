<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080b13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="명조 배틀" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/SUITE-Variable.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/images/bg-shorekeeper-piano.webp?v=5k" as="image" type="image/webp" fetchpriority="high" />
    <title>명조: 대결 (Wuthering Waves TCG)</title>
    <style>
      html, body {
        background-color: #080b13;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
      }
      *, *::before, *::after {
        font-family: 'SUITE', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      }
      body {
        font-family: 'SUITE', sans-serif;
      }
      /* 축소 카드 이미지 자글거림(모아레) 부드러운 렌더링 */
      img, picture {
        image-rendering: auto;
        image-rendering: smooth;
        image-rendering: high-quality;
      }
      .card-img, .card-texture, [data-card-img] {
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        outline: 1px solid transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-install-available'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
